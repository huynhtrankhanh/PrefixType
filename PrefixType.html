<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PrefixType</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f9;
      --surface: #ffffff;
      --line: #dfe3eb;
      --ink: #172033;
      --muted: #737b8f;
      --accent: #5362e8;
      --correct: #0d8b50;
      --wrong: #d43f3f;
      --wrong-bg: #ffe3e3;
      --remaining: #9299aa;
      --shadow: 0 16px 42px rgba(30, 38, 68, 0.10);
      --vv-height: 100dvh;
      --vv-top: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 0%, #e8eaff 0, transparent 26rem),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(1100px, calc(100% - 24px));
      height: var(--vv-height);
      margin: var(--vv-top) auto 0;
      padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom));
      transition: height 120ms ease;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 44px;
      margin-bottom: 8px;
    }

    .brand {
      margin-right: auto;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .status {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 750;
    }

    .sensor-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 4;
      min-height: 22px;
      padding: 2px 8px;
      border: 0;
      border-radius: 0;
      font-size: 11px;
      background: #eef0ff;
      color: #3847b2;
    }
    .sensor-strip[data-recording="true"] {
      background: #e1f4e9;
      color: #09663b;
      opacity: 1;
      cursor: default;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-weight: 800;
    }

    button:hover {
      border-color: #c8cedb;
      background: #fafbfe;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .workspace {
      display: flex;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      flex-direction: column;
    }

    .stats {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .stat {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      padding: 9px 7px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat strong {
      font-size: 1.08rem;
      letter-spacing: -0.04em;
    }

    .stat span {
      overflow: hidden;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 850;
      text-overflow: ellipsis;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    .editor-drawer {
      display: none;
      flex: 0 0 auto;
      padding: 9px;
      border-bottom: 1px solid var(--line);
      background: #f8f9fc;
    }

    .editor-drawer.open {
      display: block;
    }

    .editor-drawer textarea {
      display: block;
      width: 100%;
      min-height: 84px;
      max-height: 28vh;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      line-height: 1.5;
      outline: none;
      font-size: 16px;
    }

    .drawer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .progress {
      flex: 0 0 4px;
      background: #e8ebf1;
    }

    .progress > div {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 100ms linear;
    }

    .typing-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: var(--surface);
      isolation: isolate;
    }

    .typing-input, .native-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      outline: none;
      padding: clamp(18px, 3vw, 34px);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      line-height: 1.85;
      background: transparent;
      color: var(--ink);
      resize: none;
    }
    .typing-input { padding: 0; touch-action: none; }
    /* Canvas insets are applied by the renderer, without scaling its bitmap. */
    .typing-input:focus-visible { box-shadow: inset 0 0 0 2px #5362e855; }
    [hidden] { display: none !important; }
    .selection-handle {
      position: absolute;
      z-index: 4;
      width: 44px;
      height: 44px;
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -5px);
      touch-action: none;
    }
    .selection-handle::after {
      content: "";
      display: block;
      width: 20px;
      height: 24px;
      margin: -3px auto 0;
      border-radius: 2px 14px 14px 14px;
      background: var(--accent);
      transform: rotate(45deg);
    }
    .selection-handle:hover { background: transparent; }
    .selection-toolbar {
      position: absolute;
      z-index: 5;
      display: flex;
      background: white;
      box-shadow: 0 3px 16px #17203333;
      border-radius: 8px;
    }
    .selection-toolbar button { border: 0; font-size: 13px; padding: 7px; }

    .finished {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 3;
      display: none;
      border: 1px solid #b8dfc8;
      border-radius: 999px;
      background: #e8f8ee;
      color: #11683d;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-weight: 900;
      box-shadow: 0 8px 24px rgba(20, 100, 60, 0.14);
    }

    .finished.show {
      display: block;
    }

    body.keyboard-open .app {
      width: min(1100px, calc(100% - 8px));
      padding-top: 3px;
      padding-bottom: max(3px, env(safe-area-inset-bottom));
    }

    body.keyboard-open .topbar {
      min-height: 34px;
      margin-bottom: 3px;
      justify-content: flex-end;
    }

    body.keyboard-open .brand,
    body.keyboard-open .status {
      display: none;
    }

    body.keyboard-open button {
      min-height: 31px;
      padding: 5px 9px;
      font-size: 0.8rem;
    }

    body.keyboard-open .stat {
      gap: 4px;
      padding: 4px;
    }

    body.keyboard-open .stat strong {
      font-size: 0.92rem;
    }

    body.keyboard-open .stat span {
      font-size: 0.55rem;
    }

    body.keyboard-open .native-input {
      padding-top: 14px;
      padding-bottom: 28px;
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 10px, 1100px);
        padding-top: max(5px, env(safe-area-inset-top));
        padding-bottom: max(5px, env(safe-area-inset-bottom));
      }

      .topbar {
        min-height: 38px;
        margin-bottom: 5px;
      }

      .brand, .status {
        display: none;
      }

      button {
        min-height: 33px;
        padding: 6px 9px;
        font-size: 0.82rem;
      }

      .stat {
        gap: 4px;
        padding: 6px 3px;
      }

      .stat strong {
        font-size: 0.96rem;
      }

      .stat span {
        font-size: 0.57rem;
      }

      .typing-input,
      .native-input {
        font-size: 1.04rem;
        line-height: 1.75;
      }
    }


    .records-drawer {
      display: none;
      flex: 0 0 auto;
      max-height: min(42vh, 360px);
      overflow: auto;
      border-bottom: 1px solid var(--line);
      background: #f8f9fc;
      padding: 10px;
    }

    .records-drawer.open {
      display: block;
    }

    .records-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .records-head strong {
      font-size: 0.9rem;
    }

    .records-head span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
    }

    .records-list {
      display: grid;
      gap: 7px;
    }

    .record-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      padding: 8px 9px;
    }

    .record-day {
      min-width: 0;
    }

    .record-day strong,
    .record-day span {
      display: block;
    }

    .record-day strong {
      overflow: hidden;
      font-size: 0.84rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-day span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .record-total {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .record-live {
      color: var(--accent);
    }

    .records-empty {
      color: var(--muted);
      padding: 8px 2px;
      font-size: 0.8rem;
    }

  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">PrefixType</div>
      <div class="status" id="status">Ready</div>
      <button id="editText" type="button">Practice text</button>
      <button id="records" type="button">Records</button>
      <button id="nativeMode" type="button" aria-pressed="false" title="Use a native textarea for assistive technology">Native input</button>
      <button id="restart" type="button">Restart</button>
    </div>

    <section class="workspace">
      <div class="stats" aria-live="polite">
        <div class="stat"><strong id="wpm">0</strong><span>WPM</span></div>
        <div class="stat"><strong id="accuracy">100%</strong><span>Accuracy</span></div>
        <div class="stat"><strong id="time">0.0s</strong><span>Time</span></div>
        <div class="stat"><strong id="progressText">0%</strong><span>Progress</span></div>
      </div>

      <div class="editor-drawer" id="editorDrawer">
        <textarea id="customText" aria-label="Custom practice text">The quick brown fox jumps over the lazy dog. Accurate typing comes from relaxed hands, steady rhythm, and focused practice.</textarea>
        <div class="drawer-actions">
          <button id="cancelEdit" type="button">Cancel</button>
          <button id="applyText" class="primary" type="button">Use text</button>
        </div>
      </div>

      <div class="records-drawer" id="recordsDrawer">
        <div class="records-head">
          <strong>Daily black boxes</strong>
          <span>Local midnight boundaries · opaque .ptbox</span>
        </div>
        <div class="records-list" id="recordsList"></div>
      </div>

      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

      <div class="typing-shell" id="typingShell">
        <canvas id="typingInput" class="typing-input" tabindex="0" role="textbox"
          aria-label="Type the practice text" aria-multiline="true" spellcheck="false"></canvas>
        <textarea id="nativeInput" class="native-input" aria-label="Type the practice text"
          spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" hidden></textarea>
        <button class="selection-handle" aria-label="Move selection start" tabindex="-1" hidden></button>
        <button class="selection-handle" aria-label="Move selection end" tabindex="-1" hidden></button>
        <div id="selectionToolbar" class="selection-toolbar" role="toolbar" aria-label="Text selection" hidden>
          <button type="button" data-action="cut">Cut</button>
          <button type="button" data-action="copy">Copy</button>
          <button type="button" data-action="paste">Paste</button>
          <button type="button" data-action="all">Select all</button>
        </div>
        <div id="finished" class="finished">Finished 🎉</div>
        <button id="sensorIndicator" class="sensor-strip" type="button" aria-live="polite" hidden></button>
      </div>
    </section>
  </main>

  <script src="vendor/bidi.js"></script>
  <script src="editor.js"></script>
  <script src="ptbox.js"></script>
  <script src="sensors.js"></script>
  <script src="app.js"></script>
</body>
</html>
