<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PrefixType</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f9;
      --surface: #ffffff;
      --line: #dfe3eb;
      --ink: #172033;
      --muted: #737b8f;
      --accent: #5362e8;
      --correct: #0d8b50;
      --wrong: #d43f3f;
      --wrong-bg: #ffe3e3;
      --remaining: #9299aa;
      --shadow: 0 16px 42px rgba(30, 38, 68, 0.10);
      --vv-height: 100dvh;
      --vv-top: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 0%, #e8eaff 0, transparent 26rem),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(1100px, calc(100% - 24px));
      height: var(--vv-height);
      margin: var(--vv-top) auto 0;
      padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom));
      transition: height 120ms ease;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      margin-bottom: 8px;
    }

    .brand {
      margin-right: auto;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .status {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 750;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-weight: 800;
    }

    button:hover {
      border-color: #c8cedb;
      background: #fafbfe;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .workspace {
      display: flex;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      flex-direction: column;
    }

    .stats {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .stat {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
      min-width: 0;
      padding: 9px 7px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat strong {
      font-size: 1.08rem;
      letter-spacing: -0.04em;
    }

    .stat span {
      overflow: hidden;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 850;
      text-overflow: ellipsis;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    .editor-drawer {
      display: none;
      flex: 0 0 auto;
      padding: 9px;
      border-bottom: 1px solid var(--line);
      background: #f8f9fc;
    }

    .editor-drawer.open {
      display: block;
    }

    .editor-drawer textarea {
      display: block;
      width: 100%;
      min-height: 84px;
      max-height: 28vh;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      line-height: 1.5;
      outline: none;
      font-size: 16px;
    }

    .drawer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .progress {
      flex: 0 0 4px;
      background: #e8ebf1;
    }

    .progress > div {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 100ms linear;
    }

    .typing-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: var(--surface);
      isolation: isolate;
    }

    .mirror,
    .typing-input,
    .caret-probe {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: auto;
      border: 0;
      padding: clamp(18px, 3vw, 34px);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      line-height: 1.85;
      letter-spacing: 0.01em;
      tab-size: 4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      scrollbar-gutter: stable;
    }

    .mirror {
      z-index: 1;
      pointer-events: none;
      color: var(--remaining);
      scrollbar-width: none;
    }

    .mirror::-webkit-scrollbar {
      display: none;
    }

    .typing-input {
      z-index: 2;
      resize: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: var(--ink);
      -webkit-text-fill-color: transparent;
      overscroll-behavior: contain;
      scroll-padding-block: 24%;
    }

    .typing-input::selection {
      background: rgba(83, 98, 232, 0.24);
    }

    .caret-probe {
      z-index: 0;
      height: auto;
      min-height: 100%;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }

    .caret-marker {
      display: inline-block;
      width: 1px;
      height: 1em;
      vertical-align: text-bottom;
    }

    .correct {
      color: var(--correct);
      font-weight: 750;
    }

    .wrong {
      color: var(--wrong);
      background: var(--wrong-bg);
      border-radius: 3px;
      text-decoration: underline wavy currentColor;
      text-underline-offset: 4px;
    }

    .remaining {
      color: var(--remaining);
    }

    .current {
      color: var(--ink);
      border-bottom: 3px solid var(--accent);
    }

    .finished {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 3;
      display: none;
      border: 1px solid #b8dfc8;
      border-radius: 999px;
      background: #e8f8ee;
      color: #11683d;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-weight: 900;
      box-shadow: 0 8px 24px rgba(20, 100, 60, 0.14);
    }

    .finished.show {
      display: block;
    }

    body.keyboard-open .app {
      width: min(1100px, calc(100% - 8px));
      padding-top: 3px;
      padding-bottom: max(3px, env(safe-area-inset-bottom));
    }

    body.keyboard-open .topbar {
      min-height: 34px;
      margin-bottom: 3px;
      justify-content: flex-end;
    }

    body.keyboard-open .brand,
    body.keyboard-open .status {
      display: none;
    }

    body.keyboard-open button {
      min-height: 31px;
      padding: 5px 9px;
      font-size: 0.8rem;
    }

    body.keyboard-open .stat {
      gap: 4px;
      padding: 4px;
    }

    body.keyboard-open .stat strong {
      font-size: 0.92rem;
    }

    body.keyboard-open .stat span {
      font-size: 0.55rem;
    }

    body.keyboard-open .mirror,
    body.keyboard-open .typing-input,
    body.keyboard-open .caret-probe {
      padding-top: 14px;
      padding-bottom: 28px;
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 10px, 1100px);
        padding-top: max(5px, env(safe-area-inset-top));
        padding-bottom: max(5px, env(safe-area-inset-bottom));
      }

      .topbar {
        min-height: 38px;
        margin-bottom: 5px;
      }

      .status {
        display: none;
      }

      button {
        min-height: 33px;
        padding: 6px 9px;
        font-size: 0.82rem;
      }

      .stat {
        gap: 4px;
        padding: 6px 3px;
      }

      .stat strong {
        font-size: 0.96rem;
      }

      .stat span {
        font-size: 0.57rem;
      }

      .mirror,
      .typing-input,
      .caret-probe {
        padding: 16px;
        font-size: 1.04rem;
        line-height: 1.75;
      }
    }


    .records-drawer {
      display: none;
      flex: 0 0 auto;
      max-height: min(42vh, 360px);
      overflow: auto;
      border-bottom: 1px solid var(--line);
      background: #f8f9fc;
      padding: 10px;
    }

    .records-drawer.open {
      display: block;
    }

    .records-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .records-head strong {
      font-size: 0.9rem;
    }

    .records-head span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
    }

    .records-list {
      display: grid;
      gap: 7px;
    }

    .record-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      padding: 8px 9px;
    }

    .record-day {
      min-width: 0;
    }

    .record-day strong,
    .record-day span {
      display: block;
    }

    .record-day strong {
      overflow: hidden;
      font-size: 0.84rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-day span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .record-total {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .record-live {
      color: var(--accent);
    }

    .records-empty {
      color: var(--muted);
      padding: 8px 2px;
      font-size: 0.8rem;
    }

  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">PrefixType</div>
      <div class="status" id="status">Ready</div>
      <button id="editText" type="button">Practice text</button>
      <button id="records" type="button">Records</button>
      <button id="restart" type="button">Restart</button>
    </div>

    <section class="workspace">
      <div class="stats" aria-live="polite">
        <div class="stat"><strong id="wpm">0</strong><span>WPM</span></div>
        <div class="stat"><strong id="accuracy">100%</strong><span>Accuracy</span></div>
        <div class="stat"><strong id="time">0.0s</strong><span>Time</span></div>
        <div class="stat"><strong id="progressText">0%</strong><span>Progress</span></div>
      </div>

      <div class="editor-drawer" id="editorDrawer">
        <textarea id="customText" aria-label="Custom practice text">The quick brown fox jumps over the lazy dog. Accurate typing comes from relaxed hands, steady rhythm, and focused practice.</textarea>
        <div class="drawer-actions">
          <button id="cancelEdit" type="button">Cancel</button>
          <button id="applyText" class="primary" type="button">Use text</button>
        </div>
      </div>

      <div class="records-drawer" id="recordsDrawer">
        <div class="records-head">
          <strong>Daily black boxes</strong>
          <span>Local midnight boundaries · opaque .ptbox</span>
        </div>
        <div class="records-list" id="recordsList"></div>
      </div>

      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

      <div class="typing-shell" id="typingShell">
        <div id="caretProbe" class="caret-probe" aria-hidden="true"></div>
        <div id="mirror" class="mirror" aria-hidden="true"></div>
        <textarea
          id="typingInput"
          class="typing-input"
          aria-label="Type the practice text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
        ></textarea>
        <div id="finished" class="finished">Finished 🎉</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const typingInput = document.getElementById("typingInput");
      const customText = document.getElementById("customText");
      const mirror = document.getElementById("mirror");
      const caretProbe = document.getElementById("caretProbe");
      const editorDrawer = document.getElementById("editorDrawer");
      const recordsDrawer = document.getElementById("recordsDrawer");
      const recordsList = document.getElementById("recordsList");
      const status = document.getElementById("status");
      const finishedBadge = document.getElementById("finished");

      const wpmEl = document.getElementById("wpm");
      const accuracyEl = document.getElementById("accuracy");
      const timeEl = document.getElementById("time");
      const progressTextEl = document.getElementById("progressText");
      const progressBar = document.getElementById("progressBar");

      const DB_NAME = "prefixtype-blackbox";
      const DB_VERSION = 1;
      const SESSION_STORE = "sessions";
      const EVENT_STORE = "events";

      let practiceText = customText.value.replace(/\r\n/g, "\n");
      let startedAt = null;
      let finishedAt = null;
      let timerId = null;
      let previousValue = "";
      let totalInserted = 0;
      let correctInserted = 0;
      let caretFrame = 0;
      let geometryFrame = 0;
      let recordsRefreshId = null;
      let recorderCheckpointId = null;
      let activeSession = null;
      let writeChain = Promise.resolve();
      let initialViewportHeight = Math.max(
        window.innerHeight,
        window.visualViewport ? window.visualViewport.height : 0
      );

      const dbPromise = openBlackBoxDb().then(async (db) => {
        await recoverInterruptedSessions(db);
        return db;
      }).catch((error) => {
        console.error("Black box storage unavailable", error);
        status.textContent = "Storage unavailable";
        return null;
      });

      function openBlackBoxDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(SESSION_STORE)) {
              db.createObjectStore(SESSION_STORE, { keyPath: "id" });
            }
            if (!db.objectStoreNames.contains(EVENT_STORE)) {
              const events = db.createObjectStore(EVENT_STORE, {
                keyPath: "k",
                autoIncrement: true
              });
              events.createIndex("sid", "sid", { unique: false });
              events.createIndex("t", "t", { unique: false });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function transactionDone(tx) {
        return new Promise((resolve, reject) => {
          tx.oncomplete = () => resolve();
          tx.onabort = () => reject(tx.error || new Error("IndexedDB transaction aborted"));
          tx.onerror = () => reject(tx.error || new Error("IndexedDB transaction failed"));
        });
      }

      async function recoverInterruptedSessions(db) {
        const readTx = db.transaction(SESSION_STORE, "readonly");
        const sessions = await requestResult(readTx.objectStore(SESSION_STORE).getAll());
        await transactionDone(readTx);

        const interrupted = sessions.filter((session) => session.z == null);
        if (!interrupted.length) return;

        const writeTx = db.transaction(SESSION_STORE, "readwrite");
        const store = writeTx.objectStore(SESSION_STORE);
        for (const session of interrupted) {
          session.z = session.c || session.a;
          session.c = session.z;
          session.r = "recovered";
          store.put(session);
        }
        await transactionDone(writeTx);
      }

      function enqueueWrite(work) {
        writeChain = writeChain
          .then(async () => {
            const db = await dbPromise;
            if (db) await work(db);
          })
          .catch((error) => {
            console.error("Black box write failed", error);
            status.textContent = "Storage error";
          });
        return writeChain;
      }

      function putSession(session) {
        const snapshot = { ...session };
        return enqueueWrite(async (db) => {
          const tx = db.transaction(SESSION_STORE, "readwrite");
          tx.objectStore(SESSION_STORE).put(snapshot);
          await transactionDone(tx);
        });
      }

      function putDelta(session, event) {
        const sessionSnapshot = { ...session };
        const eventSnapshot = { ...event };
        return enqueueWrite(async (db) => {
          const tx = db.transaction([SESSION_STORE, EVENT_STORE], "readwrite");
          tx.objectStore(SESSION_STORE).put(sessionSnapshot);
          tx.objectStore(EVENT_STORE).add(eventSnapshot);
          await transactionDone(tx);
        });
      }

      async function getAllSessions() {
        await writeChain;
        const db = await dbPromise;
        if (!db) return [];
        const tx = db.transaction(SESSION_STORE, "readonly");
        const result = await requestResult(tx.objectStore(SESSION_STORE).getAll());
        await transactionDone(tx);
        return result;
      }

      async function getEventsForSession(sessionId) {
        await writeChain;
        const db = await dbPromise;
        if (!db) return [];
        const tx = db.transaction(EVENT_STORE, "readonly");
        const index = tx.objectStore(EVENT_STORE).index("sid");
        const result = await requestResult(index.getAll(IDBKeyRange.only(sessionId)));
        await transactionDone(tx);
        result.sort((a, b) => a.t - b.t || a.k - b.k);
        return result;
      }

      function makeSessionId(now) {
        if (crypto.randomUUID) return `${now.toString(36)}-${crypto.randomUUID()}`;
        const bytes = crypto.getRandomValues(new Uint32Array(4));
        return `${now.toString(36)}-${Array.from(bytes, (n) => n.toString(36)).join("-")}`;
      }

      function beginRecordingSession(at) {
        if (activeSession) return;
        activeSession = {
          id: makeSessionId(at),
          a: at,
          z: null,
          c: at,
          r: null,
          x: practiceText,
          q: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
          o: new Date(at).getTimezoneOffset()
        };
        putSession(activeSession);
        recorderCheckpointId = window.setInterval(() => {
          if (!activeSession) return;
          activeSession.c = Date.now();
          putSession(activeSession);
        }, 5000);
      }

      function finalizeRecording(reason, at = Date.now()) {
        if (!activeSession) return;
        activeSession.z = Math.max(activeSession.a, at);
        activeSession.c = activeSession.z;
        activeSession.r = reason;
        putSession(activeSession);
        activeSession = null;
        if (recorderCheckpointId !== null) {
          window.clearInterval(recorderCheckpointId);
          recorderCheckpointId = null;
        }
      }

      function replacementDelta(before, after) {
        const isHighSurrogate = (unit) => {
          const code = unit ? unit.charCodeAt(0) : 0;
          return code >= 0xd800 && code <= 0xdbff;
        };
        const isLowSurrogate = (unit) => {
          const code = unit ? unit.charCodeAt(0) : 0;
          return code >= 0xdc00 && code <= 0xdfff;
        };

        let prefix = 0;
        const shared = Math.min(before.length, after.length);
        while (prefix < shared && before[prefix] === after[prefix]) prefix += 1;

        // Never cut the compact replacement between a UTF-16 surrogate pair.
        // TextEncoder would otherwise replace a saved lone surrogate with U+FFFD.
        const prefixSplitsPair =
          (prefix > 0 && prefix < before.length &&
            isHighSurrogate(before[prefix - 1]) && isLowSurrogate(before[prefix])) ||
          (prefix > 0 && prefix < after.length &&
            isHighSurrogate(after[prefix - 1]) && isLowSurrogate(after[prefix]));
        if (prefixSplitsPair) prefix -= 1;

        let suffix = 0;
        while (
          suffix < before.length - prefix &&
          suffix < after.length - prefix &&
          before[before.length - 1 - suffix] === after[after.length - 1 - suffix]
        ) {
          suffix += 1;
        }

        const beforeBoundary = before.length - suffix;
        const afterBoundary = after.length - suffix;
        const suffixSplitsPair =
          (suffix > 0 && beforeBoundary > 0 && beforeBoundary < before.length &&
            isHighSurrogate(before[beforeBoundary - 1]) && isLowSurrogate(before[beforeBoundary])) ||
          (suffix > 0 && afterBoundary > 0 && afterBoundary < after.length &&
            isHighSurrogate(after[afterBoundary - 1]) && isLowSurrogate(after[afterBoundary]));
        if (suffixSplitsPair) suffix -= 1;

        return {
          p: prefix,
          d: before.length - prefix - suffix,
          i: after.slice(prefix, after.length - suffix)
        };
      }

      function recordTextareaState(before, after, at) {
        beginRecordingSession(at);
        const delta = replacementDelta(before, after);
        activeSession.c = at;
        putDelta(activeSession, {
          sid: activeSession.id,
          t: at,
          p: delta.p,
          d: delta.d,
          i: delta.i,
          s: typingInput.selectionStart ?? after.length,
          e: typingInput.selectionEnd ?? after.length
        });
      }

      function applyDelta(value, event) {
        return value.slice(0, event.p) + event.i + value.slice(event.p + event.d);
      }

      function prefixLength(typed, target) {
        const limit = Math.min(typed.length, target.length);
        let index = 0;
        while (index < limit && typed[index] === target[index]) index += 1;
        return index;
      }

      function span(className, text) {
        const node = document.createElement("span");
        node.className = className;
        node.textContent = text;
        return node;
      }

      function syncGeometry() {
        cancelAnimationFrame(geometryFrame);
        geometryFrame = requestAnimationFrame(() => {
          const contentWidth = typingInput.clientWidth;
          if (contentWidth > 0) {
            mirror.style.width = `${contentWidth}px`;
            caretProbe.style.width = `${contentWidth}px`;
          }
          renderCaretProbe();
          ensureCaretVisible();
        });
      }

      function renderMirror() {
        const typed = typingInput.value;
        const prefix = prefixLength(typed, practiceText);
        const wrongTyped = typed.slice(prefix);

        mirror.replaceChildren();

        if (prefix) mirror.appendChild(span("correct", typed.slice(0, prefix)));
        if (wrongTyped) mirror.appendChild(span("wrong", wrongTyped));

        if (prefix < practiceText.length) {
          const expectedCharacter = practiceText.charAt(prefix);
          if (expectedCharacter) mirror.appendChild(span("current", expectedCharacter));
          const rest = practiceText.slice(prefix + 1);
          if (rest) mirror.appendChild(span("remaining", rest));
        }

        mirror.appendChild(document.createTextNode("\u200b"));
      }

      function renderCaretProbe() {
        const caretIndex = Math.max(
          0,
          Math.min(typingInput.selectionStart ?? typingInput.value.length, typingInput.value.length)
        );
        const marker = document.createElement("span");
        marker.className = "caret-marker";
        marker.id = "caretMarker";

        caretProbe.replaceChildren(
          document.createTextNode(typingInput.value.slice(0, caretIndex)),
          marker,
          document.createTextNode("\u200b")
        );
      }

      function syncScroll() {
        mirror.scrollTop = typingInput.scrollTop;
        mirror.scrollLeft = typingInput.scrollLeft;
      }

      function ensureCaretVisible() {
        cancelAnimationFrame(caretFrame);
        caretFrame = requestAnimationFrame(() => {
          if (document.activeElement !== typingInput) {
            syncScroll();
            return;
          }

          renderCaretProbe();
          const marker = document.getElementById("caretMarker");
          if (!marker) return;

          const lineHeight = Number.parseFloat(getComputedStyle(typingInput).lineHeight) || 30;
          const visibleHeight = typingInput.clientHeight;
          if (visibleHeight <= 0) return;

          const keyboardOpen = document.body.classList.contains("keyboard-open");
          const upperGuard = Math.min(
            visibleHeight * (keyboardOpen ? 0.16 : 0.20),
            keyboardOpen ? 46 : 72
          );
          const lowerGuard = Math.min(
            visibleHeight * (keyboardOpen ? 0.34 : 0.24),
            keyboardOpen ? 110 : 82
          );

          const caretTop = marker.offsetTop;
          const caretBottom = caretTop + lineHeight;
          const visibleTop = typingInput.scrollTop;
          const visibleBottom = visibleTop + visibleHeight;
          let nextScrollTop = visibleTop;

          if (caretBottom > visibleBottom - lowerGuard) {
            nextScrollTop = caretBottom - visibleHeight + lowerGuard;
          } else if (caretTop < visibleTop + upperGuard) {
            nextScrollTop = caretTop - upperGuard;
          }

          const maxScrollTop = Math.max(0, typingInput.scrollHeight - typingInput.clientHeight);
          nextScrollTop = Math.max(0, Math.min(nextScrollTop, maxScrollTop));

          if (Math.abs(nextScrollTop - typingInput.scrollTop) > 1) {
            typingInput.scrollTop = nextScrollTop;
          }
          syncScroll();
        });
      }

      function elapsedSeconds() {
        if (!startedAt) return 0;
        return ((finishedAt || performance.now()) - startedAt) / 1000;
      }

      function updateStats() {
        const typed = typingInput.value;
        const prefix = prefixLength(typed, practiceText);
        const seconds = Math.max(0, elapsedSeconds());
        const minutes = seconds / 60;
        const wpm = minutes > 0 ? Math.round((typed.length / 5) / minutes) : 0;
        const accuracy = totalInserted
          ? Math.round((correctInserted / totalInserted) * 100)
          : 100;
        const progress = practiceText.length
          ? Math.min(100, Math.round((prefix / practiceText.length) * 100))
          : 0;

        wpmEl.textContent = Number.isFinite(wpm) ? wpm : 0;
        accuracyEl.textContent = `${accuracy}%`;
        timeEl.textContent = `${seconds.toFixed(1)}s`;
        progressTextEl.textContent = `${progress}%`;
        progressBar.style.width = `${progress}%`;
      }

      function startTimer() {
        if (startedAt || typingInput.value.length === 0) return;
        startedAt = performance.now();
        status.textContent = "Typing";
        timerId = window.setInterval(updateStats, 100);
      }

      function stopTimer() {
        if (timerId !== null) {
          window.clearInterval(timerId);
          timerId = null;
        }
      }

      function recordInsertions(nextValue) {
        if (nextValue.length <= previousValue.length) return;

        let commonStart = 0;
        const sharedLimit = Math.min(previousValue.length, nextValue.length);
        while (
          commonStart < sharedLimit &&
          previousValue[commonStart] === nextValue[commonStart]
        ) {
          commonStart += 1;
        }

        const insertedCount = nextValue.length - previousValue.length;
        const insertedText = nextValue.slice(commonStart, commonStart + insertedCount);

        for (let i = 0; i < insertedText.length; i += 1) {
          const targetIndex = commonStart + i;
          totalInserted += 1;
          if (insertedText[i] === practiceText[targetIndex]) correctInserted += 1;
        }
      }

      function checkFinished() {
        const complete = practiceText.length > 0 && typingInput.value === practiceText;

        if (!complete) {
          finishedBadge.classList.remove("show");
          return;
        }

        if (!finishedAt) {
          finishedAt = performance.now();
          stopTimer();
          finalizeRecording("completed");
          status.textContent = "Complete";
          finishedBadge.classList.add("show");
          updateStats();
          if (recordsDrawer.classList.contains("open")) renderDailyRecords();
        }
      }

      function updateVisualViewport() {
        const viewport = window.visualViewport;
        const height = viewport ? viewport.height : window.innerHeight;
        const offsetTop = viewport ? viewport.offsetTop : 0;
        const activeTypingField =
          document.activeElement === typingInput ||
          document.activeElement === customText;

        const layoutHeight = Math.max(
          document.documentElement.clientHeight,
          window.innerHeight,
          initialViewportHeight
        );

        const keyboardLikelyOpen =
          activeTypingField &&
          (layoutHeight - height > 110 || height < initialViewportHeight * 0.76);

        document.documentElement.style.setProperty(
          "--vv-height",
          `${Math.max(260, Math.round(height))}px`
        );
        document.documentElement.style.setProperty(
          "--vv-top",
          `${Math.max(0, Math.round(offsetTop))}px`
        );
        document.body.classList.toggle("keyboard-open", keyboardLikelyOpen);
        syncGeometry();
      }

      function localDayKey(ms) {
        const date = new Date(ms);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function dayBounds(dayKey) {
        const [y, m, d] = dayKey.split("-").map(Number);
        const start = new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
        const end = new Date(y, m - 1, d + 1, 0, 0, 0, 0).getTime();
        return { start, end };
      }

      function effectiveSessionEnd(session, now) {
        if (activeSession && session.id === activeSession.id) return now;
        return session.z ?? session.c ?? session.a;
      }

      function enumerateSessionDays(session, now) {
        const end = Math.max(session.a, effectiveSessionEnd(session, now));
        const finalInstant = end > session.a ? end - 1 : session.a;
        const keys = [];
        let cursor = new Date(session.a);
        cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
        while (cursor.getTime() <= finalInstant) {
          keys.push(localDayKey(cursor.getTime()));
          cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 1);
        }
        return keys;
      }

      function accumulatedForDay(sessions, dayKey, now) {
        const bounds = dayBounds(dayKey);
        const today = localDayKey(now);
        const windowEnd = dayKey === today ? Math.min(now, bounds.end) : bounds.end;
        let total = 0;
        let count = 0;
        for (const session of sessions) {
          const sessionEnd = effectiveSessionEnd(session, now);
          const from = Math.max(bounds.start, session.a);
          const to = Math.min(windowEnd, sessionEnd);
          const startsInside = session.a >= bounds.start && session.a < windowEnd;
          if (to > from || startsInside) count += 1;
          if (to > from) total += to - from;
        }
        return { total, count };
      }

      function formatDuration(ms) {
        const seconds = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        if (h) return `${h}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
        if (m) return `${m}m ${String(s).padStart(2, "0")}s`;
        return `${s}s`;
      }

      async function renderDailyRecords() {
        const now = Date.now();
        const sessions = await getAllSessions();
        const keys = new Set([localDayKey(now)]);
        for (const session of sessions) {
          for (const key of enumerateSessionDays(session, now)) keys.add(key);
        }
        const sorted = Array.from(keys).sort().reverse();
        recordsList.replaceChildren();

        for (const key of sorted) {
          const { total, count } = accumulatedForDay(sessions, key, now);
          const row = document.createElement("div");
          row.className = "record-row";

          const day = document.createElement("div");
          day.className = "record-day";
          const title = document.createElement("strong");
          title.textContent = key === localDayKey(now) ? `${key} · Live` : key;
          if (key === localDayKey(now)) title.classList.add("record-live");
          const sub = document.createElement("span");
          sub.textContent = `${count} session${count === 1 ? "" : "s"}`;
          day.append(title, sub);

          const duration = document.createElement("div");
          duration.className = "record-total";
          duration.textContent = formatDuration(total);
          duration.title = "Accumulated session time";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Download";
          button.dataset.day = key;
          button.addEventListener("click", () => downloadBlackBox(key, button));

          row.append(day, duration, button);
          recordsList.appendChild(row);
        }
      }

      async function buildDailyRecord(dayKey) {
        const snapshotAt = Date.now();
        const bounds = dayBounds(dayKey);
        const today = localDayKey(snapshotAt);
        const recordEnd = dayKey === today ? Math.min(snapshotAt, bounds.end) : bounds.end;
        const sessions = await getAllSessions();
        const fragments = [];
        let accumulatedMs = 0;

        for (const session of sessions) {
          const sessionEnd = effectiveSessionEnd(session, snapshotAt);
          const fragmentStart = Math.max(bounds.start, session.a);
          const fragmentEnd = Math.max(
            fragmentStart,
            Math.min(recordEnd, sessionEnd)
          );
          const events = await getEventsForSession(session.id);
          let initialValue = "";
          const fragmentEvents = [];
          for (const event of events) {
            if (event.t < fragmentStart) {
              initialValue = applyDelta(initialValue, event);
            } else if (event.t >= bounds.start && event.t < recordEnd) {
              fragmentEvents.push(event);
            }
          }

          const startsInside = session.a >= bounds.start && session.a < recordEnd;
          if (fragmentEnd <= fragmentStart && !startsInside && !fragmentEvents.length) continue;

          fragments.push({
            session,
            fragmentStart,
            fragmentEnd,
            initialValue,
            events: fragmentEvents
          });
          accumulatedMs += Math.max(0, fragmentEnd - fragmentStart);
        }

        return {
          dayKey,
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
          dayStart: bounds.start,
          dayEnd: recordEnd,
          exportedAt: snapshotAt,
          accumulatedMs,
          fragments
        };
      }

      class BinaryWriter {
        constructor() {
          this.parts = [];
          this.encoder = new TextEncoder();
        }

        bytes(bytes) {
          this.parts.push(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
        }

        u8(value) {
          this.bytes(Uint8Array.of(value & 0xff));
        }

        f64(value) {
          const buffer = new ArrayBuffer(8);
          new DataView(buffer).setFloat64(0, value, true);
          this.bytes(buffer);
        }

        varUint(value) {
          let n = Math.max(0, Math.floor(value));
          const out = [];
          while (n >= 128) {
            out.push((n % 128) + 128);
            n = Math.floor(n / 128);
          }
          out.push(n);
          this.bytes(Uint8Array.from(out));
        }

        string(value) {
          const bytes = this.encoder.encode(value || "");
          this.varUint(bytes.length);
          this.bytes(bytes);
        }

        finish() {
          const size = this.parts.reduce((sum, part) => sum + part.byteLength, 0);
          const out = new Uint8Array(size);
          let offset = 0;
          for (const part of this.parts) {
            out.set(part, offset);
            offset += part.byteLength;
          }
          return out;
        }
      }

      /*
        PTBOX binary format, version 1. The file is intentionally opaque; this
        source is the format documentation.

        All floating timestamps are absolute Unix epoch milliseconds (Float64 LE).
        All strings are UTF-8 prefixed by an unsigned LEB128-style byte length.
        All non-timestamp integers are unsigned LEB128-style varints.

        Header:
          5 bytes  ASCII "PTBOX"
          u8       version = 1
          f64      export timestamp
          string   local calendar day key, YYYY-MM-DD
          string   IANA browser time-zone identifier when available
          f64      exact local-midnight day start timestamp
          f64      record end timestamp (next local midnight for a closed day;
                   download-click time for today's live record)
          f64      total accumulated session milliseconds inside this day window
          varuint  session-fragment count

        Each session fragment:
          string   globally unique session id
          f64      original session start timestamp
          f64      original session end timestamp, NaN while still open
          f64      this fragment's clipped start timestamp
          f64      this fragment's clipped end timestamp
          string   end reason (completed/restarted/practice-text-changed/pagehide/
                   recovered, or empty while open)
          string   IANA time zone captured when the session started
          f64      getTimezoneOffset() captured at session start, in minutes
          string   practice text for the session
          string   exact textarea value at fragment start
          varuint  textarea-delta count

        Each textarea delta:
          f64      absolute event timestamp
          varuint  replacement start index
          varuint  number of UTF-16 code units deleted
          string   inserted UTF-8 text
          varuint  selectionStart after the input event
          varuint  selectionEnd after the input event

        Reconstruct state by starting with the fragment's initial value and, for
        each delta, replacing [position, position + deleteCount) with insertedText.
      */
      function encodePtbox(record) {
        const writer = new BinaryWriter();
        writer.bytes(new TextEncoder().encode("PTBOX"));
        writer.u8(1);
        writer.f64(record.exportedAt);
        writer.string(record.dayKey);
        writer.string(record.timeZone);
        writer.f64(record.dayStart);
        writer.f64(record.dayEnd);
        writer.f64(record.accumulatedMs);
        writer.varUint(record.fragments.length);

        for (const fragment of record.fragments) {
          const session = fragment.session;
          writer.string(session.id);
          writer.f64(session.a);
          writer.f64(session.z == null ? Number.NaN : session.z);
          writer.f64(fragment.fragmentStart);
          writer.f64(fragment.fragmentEnd);
          writer.string(session.r || "");
          writer.string(session.q || "");
          writer.f64(Number.isFinite(session.o) ? session.o : Number.NaN);
          writer.string(session.x || "");
          writer.string(fragment.initialValue);
          writer.varUint(fragment.events.length);

          for (const event of fragment.events) {
            writer.f64(event.t);
            writer.varUint(event.p);
            writer.varUint(event.d);
            writer.string(event.i);
            writer.varUint(event.s);
            writer.varUint(event.e);
          }
        }
        return writer.finish();
      }

      function currentClockFileSuffix(ms) {
        const date = new Date(ms);
        return [date.getHours(), date.getMinutes(), date.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join("");
      }

      async function downloadBlackBox(dayKey, button) {
        const oldText = button.textContent;
        button.disabled = true;
        button.textContent = "Packing…";
        try {
          const record = await buildDailyRecord(dayKey);
          const bytes = encodePtbox(record);
          const blob = new Blob([bytes], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          const liveSuffix = dayKey === localDayKey(record.exportedAt)
            ? `-${currentClockFileSuffix(record.exportedAt)}`
            : "";
          link.href = url;
          link.download = `PrefixType-${dayKey}${liveSuffix}.ptbox`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
          console.error("Black box export failed", error);
          status.textContent = "Export failed";
        } finally {
          button.disabled = false;
          button.textContent = oldText;
        }
      }

      function startRecordsRefresh() {
        if (recordsRefreshId !== null) return;
        recordsRefreshId = window.setInterval(() => {
          if (recordsDrawer.classList.contains("open")) renderDailyRecords();
        }, 1000);
      }

      function stopRecordsRefresh() {
        if (recordsRefreshId !== null) {
          window.clearInterval(recordsRefreshId);
          recordsRefreshId = null;
        }
      }

      function resetSession({ focus = true, reason = "restarted" } = {}) {
        finalizeRecording(reason);
        stopTimer();
        startedAt = null;
        finishedAt = null;
        previousValue = "";
        totalInserted = 0;
        correctInserted = 0;
        typingInput.value = "";
        typingInput.maxLength = practiceText.length;
        typingInput.scrollTop = 0;
        typingInput.scrollLeft = 0;
        finishedBadge.classList.remove("show");
        status.textContent = "Ready";
        renderMirror();
        renderCaretProbe();
        syncGeometry();
        updateStats();
        if (recordsDrawer.classList.contains("open")) renderDailyRecords();
        if (focus) {
          typingInput.focus({ preventScroll: true });
          ensureCaretVisible();
        }
      }

      typingInput.addEventListener("input", () => {
        if (finishedAt) return;
        const at = Date.now();
        const nextValue = typingInput.value;
        recordInsertions(nextValue);
        startTimer();
        recordTextareaState(previousValue, nextValue, at);
        renderMirror();
        renderCaretProbe();
        updateStats();
        checkFinished();
        previousValue = nextValue;
        ensureCaretVisible();
      });

      typingInput.addEventListener("scroll", syncScroll);
      typingInput.addEventListener("focus", () => {
        editorDrawer.classList.remove("open");
        recordsDrawer.classList.remove("open");
        stopRecordsRefresh();
        updateVisualViewport();
        ensureCaretVisible();
      });
      typingInput.addEventListener("click", ensureCaretVisible);
      typingInput.addEventListener("keyup", ensureCaretVisible);
      typingInput.addEventListener("select", ensureCaretVisible);

      document.addEventListener("selectionchange", () => {
        if (document.activeElement === typingInput) ensureCaretVisible();
      });

      document.getElementById("restart").addEventListener("click", () => {
        resetSession({ reason: "restarted" });
      });

      document.getElementById("records").addEventListener("click", async () => {
        const opening = !recordsDrawer.classList.contains("open");
        recordsDrawer.classList.toggle("open", opening);
        editorDrawer.classList.remove("open");
        if (opening) {
          await renderDailyRecords();
          startRecordsRefresh();
        } else {
          stopRecordsRefresh();
          typingInput.focus({ preventScroll: true });
          ensureCaretVisible();
        }
        updateVisualViewport();
      });

      document.getElementById("editText").addEventListener("click", () => {
        const opening = !editorDrawer.classList.contains("open");
        editorDrawer.classList.toggle("open", opening);
        recordsDrawer.classList.remove("open");
        stopRecordsRefresh();

        if (opening) {
          customText.focus({ preventScroll: true });
          customText.select();
        } else {
          typingInput.focus({ preventScroll: true });
          ensureCaretVisible();
        }
        updateVisualViewport();
      });

      document.getElementById("cancelEdit").addEventListener("click", () => {
        customText.value = practiceText;
        editorDrawer.classList.remove("open");
        typingInput.focus({ preventScroll: true });
        updateVisualViewport();
        ensureCaretVisible();
      });

      document.getElementById("applyText").addEventListener("click", () => {
        const nextText = customText.value.replace(/\r\n/g, "\n");
        if (!nextText.trim()) {
          customText.focus({ preventScroll: true });
          customText.setCustomValidity("Enter some practice text.");
          customText.reportValidity();
          return;
        }

        customText.setCustomValidity("");
        practiceText = nextText;
        editorDrawer.classList.remove("open");
        resetSession({ reason: "practice-text-changed" });
        updateVisualViewport();
      });

      window.addEventListener("pagehide", () => {
        finalizeRecording("pagehide");
      });

      window.addEventListener("resize", updateVisualViewport);
      window.addEventListener("orientationchange", () => {
        window.setTimeout(() => {
          initialViewportHeight = Math.max(
            window.innerHeight,
            window.visualViewport ? window.visualViewport.height : 0
          );
          updateVisualViewport();
        }, 250);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateVisualViewport);
        window.visualViewport.addEventListener("scroll", updateVisualViewport);
      }

      if ("ResizeObserver" in window) {
        new ResizeObserver(syncGeometry).observe(typingInput);
      }

      updateVisualViewport();
      resetSession({ focus: false, reason: "initialization" });
    })();
  </script>
</body>
</html>
